<div class="app-container">
  <header class="app-header">
    <div class="logo-section">
      <h1 class="logo-title">Sistema Cheques</h1>
      <span class="logo-subtitle">Gestión financiera</span>
    </div>
    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <i class="material-icons">dashboard</i>
        Dashboard
      </a>
      <a routerLink="/cheques" routerLinkActive="active" class="nav-item">
        <i class="material-icons">payments</i>
        Cheques
      </a>
      <a routerLink="/beneficiarios" routerLinkActive="active" class="nav-item">
        <i class="material-icons">people</i>
        Beneficiarios
      </a>
    </nav>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Global Loader Overlay -->
<div class="global-loader-overlay" *ngIf="isLoading$ | async">
  <div class="spinner"></div>
  <div style="font-weight: 500; font-size: 0.95rem;">Procesando datos...</div>
</div>
